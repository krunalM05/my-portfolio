<div id="projects" class="container my-5">
    <div class="row justify-content-center">
        <div class="col-12 col-md-10 col-lg-8">
            <div class="shadow p-4 rounded bg-white">
                <div class="projects-container d-flex flex-column gap-4">
                    <div *ngFor="let project of projects" class="project-card">
                        <h3>{{ project.title }}</h3>
                        <p class="company-role">{{ project.company }} – {{ project.role }} | {{ project.duration }}</p>
                        <p class="description">{{ project.description }}</p>
                        <ul>
                            <li *ngFor="let resp of project.responsibilities">{{ resp }}</li>
                        </ul>
                        <div class="tech-stack">
                            <span *ngFor="let tech of project.techStack" class="tech-chip">{{ tech }}</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
